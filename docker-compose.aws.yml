version: "3.8"

services:
  mongo:
    image: mongo:6
    container_name: homedine-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  backend:
    image: ${BACKEND_IMAGE}
    container_name: homedine-backend
    env_file:
      - .env
    environment:
      - CORS_ORIGIN=http://3.26.116.51
      - FRONTEND_URL=http://3.26.116.51
    depends_on:
      - mongo
    restart: unless-stopped
    ports:
      - "5000:5000"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: homedine-frontend
    environment:
      - VITE_API_URL_AWS=/api
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  mongodata: