name: Build & Deploy to AWS

on:
  push:
    branches:
      - master

env:
  DOCKER_REGISTRY: soumyosish1
  BACKEND_IMAGE: soumyosish1/homedine-backend:${{ github.run_number }}
  FRONTEND_IMAGE: soumyosish1/homedine-frontend:${{ github.run_number }}
  EC2_IP: ${{ secrets.EC2_IP }}
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create environment files
        run: |
          mkdir -p backend frontend
          echo "${{ secrets.BACKEND_ENV_DOCKER }}" > backend/.env.docker
          echo "VITE_API_URL=/api" > frontend/.env.docker
          echo "VITE_API_URL_AWS=http://${{ env.EC2_IP }}:5000/api" >> frontend/.env.docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.EC2_IP }}
          username: ubuntu
          key: ${{ env.EC2_SSH_KEY }}
          source: "docker-compose.aws.yml,backend/.env.docker"
          target: "/home/ubuntu/HomeDine"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_IP }}
          username: ubuntu
          key: ${{ env.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/HomeDine

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
              sudo usermod -aG docker ubuntu
            fi

            if ! docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            # Set environment variables for docker compose
            export BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}
            export FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}

            docker pull $BACKEND_IMAGE
            docker pull $FRONTEND_IMAGE

            docker compose -f docker-compose.aws.yml down || true
            docker compose -f docker-compose.aws.yml up -d --remove-orphans

            sleep 5
            curl http://localhost:5000/api/health || echo "Backend health check pending..."